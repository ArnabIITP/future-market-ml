[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "future-market-ml"
version = "0.1.0"
description = "Walk-forward volatility and limit-order-book prediction under distribution shift"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10", "requests>=2.31"]

[project.optional-dependencies]
download = ["yfinance>=0.2.40"]
xgboost = ["xgboost>=2.0"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7", "reportlab>=4.0", "pdfplumber>=0.11"]
test = ["pytest>=8.0"]
microstructure = ["xgboost>=2.0", "matplotlib>=3.7", "reportlab>=4.0"]
nasdaq_itch = ["meatpy==0.5.0", "pyarrow>=18.0.0", "xgboost>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["src*"]
